<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orleans 激活实例负载均衡</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    :root {
      --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --card-dark-bg: rgba(44, 62, 80, 0.95);
      --text-primary: #2c3e50;
      --text-secondary: #7f8c8d;
      --text-light: #ecf0f1;
      --border-radius: 16px;
      --shadow-soft: 0 10px 40px rgba(0, 0, 0, 0.1);
      --shadow-strong: 0 20px 60px rgba(0, 0, 0, 0.15);
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--primary-gradient);
      height: 100vh;
      color: var(--text-primary);
      padding: 12px;
      line-height: 1.6;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .container {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
      flex-shrink: 0;
    }

    h1 {
      color: white;
      font-size: clamp(1.5rem, 3vw, 2.5rem);
      font-weight: 700;
      margin-bottom: 6px;
      text-shadow: 0 4px 8px rgba(0,0,0,0.2);
      letter-spacing: -0.02em;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(0.9rem, 1.5vw, 1.1rem);
      font-weight: 400;
      margin-bottom: 12px;
    }

    .dashboard-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
      min-height: 0;
    }

    .unified-chart-section {
      background: var(--card-dark-bg);
      border-radius: 12px;
      padding: 20px;
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    .charts-container {
      display: grid;
      grid-template-columns: 4fr 1fr;
      gap: 20px;
      flex: 1;
      min-height: 0;
    }

    .line-chart-area {
      grid-column: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .bar-chart-area {
      grid-column: 2;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chart-subtitle {
      font-size: 0.9rem;
      font-weight: 500;
      color: rgba(236, 240, 241, 0.8);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .bar {
      fill-opacity: 0.9;
      transition: var(--transition);
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.2));
    }

    .bar:hover {
      fill-opacity: 1;
      transform: scaleY(1.02);
    }

    .bar-label {
      text-anchor: middle;
      font-size: 13px;
      fill: var(--text-light);
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .max-scale-label {
      font-weight: 500;
      fill: #bdc3c7;
      font-size: 11px;
    }

    .bar-chart {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex: 1;
      gap: 8px;
      min-height: 0;
    }

    .line-chart {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .line {
      filter: drop-shadow(0 3px 6px rgba(0,0,0,0.15));
      stroke-width: 3;
      transition: var(--transition);
    }

    .line:hover {
      stroke-width: 4;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.25));
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--text-light);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .legend-color {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .legend-color-1 { background-color: #ff6b6b; }
    .legend-color-2 { background-color: #4ecdc4; }
    .legend-color-3 { background-color: #45b7d1; }
    .legend-color-4 { background-color: #f9ca24; }
    .legend-color-5 { background-color: #dda0dd; }
    /* 密度矩阵的网格样式 */
    rect {
      transition: var(--transition);
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 0.5;
    }

    rect:hover {
      stroke-width: 2;
      stroke: rgba(255, 255, 255, 0.6);
      filter: brightness(1.1);
    }

    /* 坐标轴样式 */
    .axis text {
      font-size: 12px;
      fill: var(--text-light);
      font-family: 'Inter', sans-serif;
    }

    .axis path,
    .axis line {
      fill: none;
      stroke: rgba(236, 240, 241, 0.3);
      shape-rendering: crispEdges;
      stroke-width: 1;
    }

    .axis-title {
      font-size: 14px;
      font-weight: 500;
      fill: var(--text-light);
    }

    /* 现代样式的滚动条 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      transition: var(--transition);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.5);
    }

    /* 加载动画 */
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .loading {
      animation: pulse 2s infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Orleans 激活实例负载均衡</h1>
      <p class="subtitle">实时监视并可视化 Grain 激活实例在各个 Silo 之间的分布</p>
    </div>

    <div class="dashboard-grid">
      <div class="unified-chart-section">
        <div class="charts-container">
          <div class="line-chart-area">
            <div class="chart-subtitle">时间变化</div>
            <div id="line-chart" class="line-chart"></div>
          </div>

          <div class="bar-chart-area">
            <div class="chart-subtitle">当前分布</div>
            <div id="bar-charts" class="bar-chart"></div>
          </div>
        </div>

        <div class="legend">
          <div class="legend-item">
            <div class="legend-color legend-color-1"></div>
            <span>Silo 1</span>
          </div>
          <div class="legend-item">
            <div class="legend-color legend-color-2"></div>
            <span>Silo 2</span>
          </div>
          <div class="legend-item">
            <div class="legend-color legend-color-3"></div>
            <span>Silo 3</span>
          </div>
          <div class="legend-item">
            <div class="legend-color legend-color-4"></div>
            <span>Silo 4</span>
          </div>
          <div class="legend-item">
            <div class="legend-color legend-color-5"></div>
            <span>Silo 5</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 根据可用空间计算尺寸
    const headerHeight = document.querySelector('.header').offsetHeight;
    const availableHeight = window.innerHeight - headerHeight - 60; // 计入内边距和外边距
    const availableWidth = window.innerWidth - 60; // 计入内边距

    // 折线图（占宽度的 80%）
    const lineChartWidth = availableWidth * 0.75; // 计入网格间距
    const lineChartHeight = availableHeight * 0.85;

    // 条形图（占宽度的 20%）
    const barChartWidth = 50;
    const barChartContainerHeight = availableHeight * 0.85;

    const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#dda0dd'];
    const numColors = colors.length;
    const maxDataPoints = 100;

    const svgBarCharts = d3.select("#bar-charts")
      .selectAll("svg")
      .data(colors)
      .enter()
      .append("svg")
      .attr("width", barChartWidth)
      .attr("height", barChartContainerHeight)
      .append("g")
      .attr("transform", `translate(${barChartWidth / 2}, 0)`);

    svgBarCharts.append("line")
      .attr("x1", 0)
      .attr("y1", barChartContainerHeight)
      .attr("x2", 0)
      .attr("y2", 0)
      .attr("stroke", "#ecf0f1")
      .attr("stroke-width", 1);

    svgBarCharts.append("line")
      .attr("x1", -barChartWidth / 2)
      .attr("y1", barChartContainerHeight)
      .attr("x2", barChartWidth / 2)
      .attr("y2", barChartContainerHeight)
      .attr("stroke", "#ecf0f1")
      .attr("stroke-width", 1);

    svgBarCharts.append("text")
      .attr("class", "bar-label")
      .attr("x", 0)
      .attr("y", barChartContainerHeight + 20)
      .text(d => "0");

    // 在顶部添加最大刻度标签
    svgBarCharts.append("text")
      .attr("class", "max-scale-label")
      .attr("x", 0)
      .attr("y", -5)
      .attr("text-anchor", "middle")
      .attr("font-size", "10px")
      .attr("fill", "#666")
      .text("0");

    const svgLineChart = d3.select("#line-chart")
      .append("svg")
      .attr("width", lineChartWidth)
      .attr("height", lineChartHeight)
      .style("border-radius", "8px");

    const xScale = d3.scaleLinear()
      .domain([0, maxDataPoints - 1])
      .range([0, lineChartWidth - 50]);

    let yScale = d3.scaleLinear()
      .domain([0, 750])
      .range([lineChartHeight, 0]);

    const xAxis = d3.axisBottom(xScale).ticks(5);
    let yAxis = d3.axisLeft(yScale).ticks(5);

    svgLineChart.append("g")
      .attr("class", "x-axis axis")
      .attr("transform", `translate(50, ${lineChartHeight - 30})`)
      .call(xAxis);

    svgLineChart.append("g")
      .attr("class", "y-axis axis")
      .attr("transform", `translate(50, 0)`)
      .call(yAxis);

    // 添加坐标轴标签
    svgLineChart.append("text")
      .attr("class", "axis-title")
      .attr("transform", "rotate(-90)")
      .attr("y", 15)
      .attr("x", -lineChartHeight / 2)
      .style("text-anchor", "middle")
      .text("Activation Count");

    svgLineChart.append("text")
      .attr("class", "axis-title")
      .attr("x", lineChartWidth / 2 + 25)
      .attr("y", lineChartHeight - 5)
      .style("text-anchor", "middle")
      .text("Time (Data Points)");

    // 创建裁剪路径，将折线图限制在指定区域内
    svgLineChart.append("defs")
      .append("clipPath")
      .attr("id", "chart-clip")
      .append("rect")
      .attr("width", lineChartWidth - 50)
      .attr("height", lineChartHeight)
      .attr("x", 0)
      .attr("y", 0);

    // 为将被裁剪的折线创建容器组
    const linesContainer = svgLineChart.append("g")
      .attr("transform", "translate(50, 0)")
      .attr("clip-path", "url(#chart-clip)");

    const lineGenerators = colors.map(() => d3.line()
      .x((d, i) => xScale(i))
      .y(d => yScale(d)));

    const linePaths = linesContainer.selectAll(".line")
      .data(colors)
      .enter()
      .append("path")
      .attr("class", "line")
      .attr("stroke", (d, i) => colors[i])
      .attr("fill", "none")
      .attr("stroke-width", 3)
      .attr("stroke-linecap", "round")
      .attr("stroke-linejoin", "round");

    const activationsHistory = colors.map(() => []);

    const worker = new Worker('worker.js');

    function updateChart(data) {
      worker.postMessage(data);

      worker.onmessage = function (event) {
        const { densityMatrix, error } = event.data;

        if (error) {
          console.error('Error from worker:', error);
          return;
        }

        // 计算所有 Silo 中的最大激活实例数，用于设置比例尺
        const maxActivations = Math.max(...data.map(silo => silo.activations));
        const barScale = d3.scaleLinear()
          .domain([0, maxActivations])
          .range([0, barChartContainerHeight - 30]); // 为标签留出一些空间

        svgBarCharts.each(function (d, i) {
          const barChart = d3.select(this);

          const bars = barChart.selectAll(".bar")
            .data([data[i].activations]);

          bars.enter()
            .append("rect")
            .attr("class", "bar")
            .merge(bars)
            .attr("x", -barChartWidth / 2 + 5)
            .attr("y", d => barChartContainerHeight - barScale(d))
            .attr("width", barChartWidth - 20)
            .attr("height", d => barScale(d))
            .attr("fill", colors[i])
            .attr("rx", 4) // 圆角
            .attr("ry", 4);

          bars.exit().remove();

          barChart.select(".bar-label")
            .text(data[i].activations);

          // 更新最大刻度标签
          barChart.select(".max-scale-label")
            .text(maxActivations);
        });

        data.forEach((silo, i) => {
          activationsHistory[i].push(silo.activations);

          // 仅保留最近的 maxDataPoints 个数据点，以实现平滑滚动
          if (activationsHistory[i].length > maxDataPoints) {
            activationsHistory[i].shift();
          }
        });

        // 根据所有可见历史数据中的当前最大值更新折线图比例尺
        const allHistoryValues = activationsHistory.flat();
        const maxHistoryValue = allHistoryValues.length > 0 ? Math.max(...allHistoryValues) : 750;
        const rawMaxValue = Math.max(maxHistoryValue, maxActivations);

        // 在最大值上方增加 20% 的余量，留出适当空间
        const newMaxValue = rawMaxValue * 1.2;

        // 根据需要更新 Y 轴比例尺的定义域
        yScale.domain([0, newMaxValue]);
        yAxis = d3.axisLeft(yScale).ticks(5);

        // 更新 Y 轴
        svgLineChart.select(".y-axis")
          .transition()
          .duration(300)
          .call(yAxis);

        // 使用新的比例尺更新折线生成器
        const updatedLineGenerators = colors.map(() => d3.line()
          .x((d, i) => xScale(i))
          .y(d => yScale(d)));

        linePaths.each(function (d, i) {
          d3.select(this)
            .datum(activationsHistory[i])
            .attr("d", updatedLineGenerators[i]);
        });
      };
    }

    function fetchData() {
      fetch('/api/stats/silos')
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.json();
        })
        .then(newData => {
          console.log('Fetched Data:', newData);
          updateChart(newData);
        })
        .catch(error => {
          console.error('Error fetching grain stats:', error);
        });
    }

    setInterval(fetchData, 500);
    fetchData();

    // 处理窗口大小变化以适应不同尺寸
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(() => {
        // 由于尺寸以视口为基准，在窗口大小明显变化时重新加载
        location.reload();
      }, 250);
    });

    // 添加键盘快捷键以改善用户体验
    document.addEventListener('keydown', (e) => {
      if (e.key === 'r' || e.key === 'R') {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          fetchData();
        }
      }
    });
  </script>
</body>
</html>
