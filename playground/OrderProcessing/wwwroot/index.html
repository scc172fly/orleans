<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Orleans 订单处理</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem; color: #222; }
    h1 { margin-top: 0; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    section { border: 1px solid #ddd; border-radius: 6px; padding: 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .25rem .5rem; border-bottom: 1px solid #eee; }
    td.num, th.num { text-align: right; }
    input { padding: .2rem; }
    .status { font-weight: 600; }
    .Cancelled { color: #b00020; }
    .Paid, .Shipped { color: #1b7f3b; }
    .muted { color: #777; font-size: .9em; }
  </style>
</head>
<body>
  <h1>订单处理</h1>
  <p>
    买家 <input id="buyer" value="alice" size="10" />
    <span class="muted">订单先等待 <code>Ordering:GracePeriod</code> ，然后验证库存。 <a href="/dashboard">仪表板</a></span>
  </p>
  <main>
    <div>
      <section>
        <h2>商品目录</h2>
        <table>
          <thead><tr><th>商品</th><th class="num">价格</th><th class="num">可用库存</th><th class="num">已预留</th><th class="num">已售出</th><th></th></tr></thead>
          <tbody id="catalog"></tbody>
        </table>
      </section>
      <section>
        <h2>购物篮</h2>
        <table>
          <thead><tr><th>商品</th><th class="num">价格</th><th class="num">数量</th></tr></thead>
          <tbody id="basket"></tbody>
        </table>
        <p>
          卡号 <input id="card" value="4111111111111111" size="18" />
          <span class="muted">尾号为 0002 的卡会被拒绝。</span>
        </p>
        <button id="checkout">结算</button> <span id="checkout-result" class="muted"></span>
      </section>
    </div>
    <section>
      <h2>订单</h2>
      <table>
        <thead><tr><th>订单</th><th>日期</th><th class="num">总额</th><th>状态</th><th></th></tr></thead>
        <tbody id="orders"></tbody>
      </table>
    </section>
  </main>
  <script>
    const statuses = ["Submitted", "AwaitingValidation", "StockConfirmed", "Paid", "Shipped", "Cancelled"];
    const buyer = () => encodeURIComponent(document.getElementById("buyer").value.trim() || "alice");
    const money = value => value.toFixed(2);
    const escape = text => String(text ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

    async function api(path, method = "GET", body) {
      const response = await fetch(`/api${path}`, {
        method,
        headers: body ? { "Content-Type": "application/json" } : {},
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!response.ok) throw new Error(await response.text() || response.statusText);
      return response.headers.get("content-type")?.includes("json") ? response.json() : null;
    }

    async function setQuantity(productId, quantity) {
      await api(`/buyers/${buyer()}/basket/${productId}`, "PUT", { quantity });
      await refresh();
    }

    async function addToBasket(productId) {
      const basket = await api(`/buyers/${buyer()}/basket`);
      const current = basket.find(item => item.productId === productId)?.quantity ?? 0;
      await setQuantity(productId, current + 1);
    }

    async function orderAction(orderId, action) {
      try { await api(`/orders/${orderId}/${action}`, "POST"); }
      catch { alert(`The order cannot be ${action === "ship" ? "shipped" : "cancelled"} in its current status.`); }
      await refresh();
    }

    document.getElementById("checkout").onclick = async () => {
      const result = document.getElementById("checkout-result");
      try {
        const { orderId } = await api(`/buyers/${buyer()}/checkout`, "POST", {
          requestId: crypto.randomUUID(),
          cardNumber: document.getElementById("card").value.trim(),
          address: { street: "15703 NE 61st Ct", city: "Redmond", state: "WA", country: "U.S.", zipCode: "98052" },
        }) ?? {};
        result.textContent = orderId ? `Submitted order ${orderId.slice(0, 8)}.` : "";
      } catch (error) {
        result.textContent = error.message;
      }
      await refresh();
    };

    async function refresh() {
      const [catalog, basket, orders] = await Promise.all([
        api("/catalog"),
        api(`/buyers/${buyer()}/basket`),
        api(`/buyers/${buyer()}/orders`),
      ]);

      document.getElementById("catalog").innerHTML = catalog.map(item => `
        <tr><td>${escape(item.name)}<br><span class="muted">${escape(item.brand)}</span></td>
        <td class="num">${money(item.price)}</td><td class="num">${item.availableStock}</td>
        <td class="num">${item.reservedStock}</td><td class="num">${item.soldStock}</td>
        <td><button onclick="addToBasket(${item.id})">Add</button></td></tr>`).join("");

      document.getElementById("basket").innerHTML = basket.length === 0
        ? `<tr><td colspan="3" class="muted">The basket is empty.</td></tr>`
        : basket.map(item => `
          <tr><td>${escape(item.productName)}</td><td class="num">${money(item.unitPrice)}</td>
          <td class="num"><input type="number" min="0" value="${item.quantity}" style="width:4em"
            onchange="setQuantity(${item.productId}, this.valueAsNumber || 0)" /></td></tr>`).join("");

      document.getElementById("orders").innerHTML = orders.length === 0
        ? `<tr><td colspan="5" class="muted">No orders yet.</td></tr>`
        : orders.map(order => {
          const status = typeof order.status === "number" ? statuses[order.status] : order.status;
          return `
          <tr><td><code>${order.orderId.slice(0, 8)}</code></td>
          <td>${new Date(order.orderDate).toLocaleTimeString()}</td><td class="num">${money(order.total)}</td>
          <td><span class="status ${status}">${status}</span><br><span class="muted">${escape(order.description)}</span></td>
          <td><button onclick="orderAction('${order.orderId}', 'cancel')">Cancel</button>
          <button onclick="orderAction('${order.orderId}', 'ship')">Ship</button></td></tr>`;
        }).join("");
    }

    refresh();
    setInterval(() => refresh().catch(() => { }), 1000);
  </script>
</body>
</html>
