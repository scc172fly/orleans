# 使用模板时，变量似乎必须定义在单独的文件中。

variables:
  build_flags: ' /m /v:m'
  solution: 'Orleans.slnx'
  codesign_runtime: '2.1.x'
  GDN_SUPPRESS_FORKED_BUILD_WARNING: true # 避免警告 "Guardian is not supported for builds from forked GitHub repositories"
  MicroBuildOutputFolderOverride: '$(Agent.TempDirectory)'
  # 不需要自动注入，因为已在启用任务的位置显式包含这些任务。
  Codeql.SkipTaskAutoInjection: true
  ${{ if eq(variables['System.TeamProject'], 'GitHub - PR Builds') }}:
    pool_name: 'orleans-pr-hosted-pool'
    pool_image: 'orleans-build-image'
    official_build: false
  ${{ else }}:
    ${{ if eq(variables['System.TeamProject'], 'internal') }}:
      pool_name: 'NetCore1ESPool-Internal'
      pool_image: '1es-windows-2022'
    ${{ else }}:
      pool_name: 'orleans-build-hosted-pool'
      pool_image: 'orleans-build-image'
    official_build: true
    # 不让 CodeQL3000 扩展控制扫描频率。
    Codeql.Cadence: 0
    # 无条件启用 CodeQL3000，使其可以在任何分支上运行。
    Codeql.Enabled: true
    # 忽略测试和基础设施代码。
    Codeql.SourceRoot: src
    # CodeQL3000 需要通过变量传递此值以启用 TSA。手动构建时不要使用 TSA。
    Codeql.TSAEnabled: ${{ eq(variables['Build.Reason'], 'Schedule') }}
    # 默认要求 tsaoptions.json 位于 SourceRoot 下。
    Codeql.TSAOptionsPath: '$(Build.SourcesDirectory)/.config/tsaoptions.json'
    # 除非是 nightly 构建或明确请求，否则不要因 CodeQL3000 任务拖慢构建。
    runCodeQL3000: ${{ or(eq(variables['Build.Reason'], 'Schedule'), and(eq(variables['Build.Reason'], 'Manual'), eq(parameters.runCodeQL3000, 'true'))) }}
