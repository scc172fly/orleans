parameters:
  - name: build_configuration
    displayName: Build configuration
    type: string
    default: Release
    values:
    - Release
    - Debug
  - name: version_prefix
    displayName: Version prefix
    type: string
    default: 9.0.0
  - name: include_suffix
    displayName: Append version suffix
    type: boolean
    default: true
  - name: version_suffix
    displayName: Version suffix
    type: string
    default: ci.$(Build.BuildNumber)
  - name: codesign
    displayName: Enable code signing
    type: boolean
    default: false
  - name: skip_test
    displayName: Skip tests
    type: boolean
    default: false
  - name: publish_nightly
    displayName: Publish to orleans-nightly
    type: boolean
    default: false
  - name: publish_nuget
    displayName: Publish to nuget.org
    type: boolean
    default: false
  - name: frameworks
    displayName: Frameworks
    type: object
    default:
    - net10.0
    - net11.0
  - name: suites
    displayName: Test suites
    type: object
    default:
    - BVT
    - SlowBVT
    - Functional
  - name: runCodeQL3000
    default: false
    displayName: Run CodeQL3000 tasks
    type: boolean

jobs:

# 向 nuget.org 发布包需要审批。
- job: PreDeploymentApprovalJob
  displayName: Pre-Deployment Approval
  timeoutInMinutes: 2880
  ${{ if and(eq(parameters.codesign, true), eq(parameters.publish_nuget, true)) }}:
    pool: server
  steps:
    - ${{ if and(eq(parameters.codesign, true), eq(parameters.publish_nuget, true)) }}:
      - task: ManualValidation@1
        inputs:
          notifyUsers: ${{ variables.notifyUsers }}
          approvers: ${{ variables.approvers }}
    - ${{ if not(and(eq(parameters.codesign, true), eq(parameters.publish_nuget, true))) }}:
      - script: echo "Skipping pre-deployment approval"

# 构建并签名 DLL，然后生成 NuGet 包并对其签名。
- job: Build
  displayName: Build and create NuGet packages
  dependsOn: PreDeploymentApprovalJob
  variables:
    ${{ if eq(parameters.codesign, true) }}:
      microbuild_signing: true
      publishVstsFeed: 'public/orleans-nightly'
    ${{ else }}:
      microbuild_signing: false
  ${{ if ne(variables['System.TeamProject'], 'GitHub - PR Builds') }}:
    templateContext:
      outputs:
      - output: pipelineArtifact
        targetPath: '$(build.sourcesdirectory)/Artifacts/${{parameters.build_configuration}}'
        artifactName: nuget
      # 将包发布到 nightly 包源。
      - ${{ if and(eq(parameters.codesign, true), eq(parameters.publish_nightly, true)) }}:
        - output: nuget
          useDotNetTask: false
          packageParentPath: $(Pipeline.Workspace)
          packagesToPush: $(build.sourcesdirectory)/Artifacts/${{parameters.build_configuration}}/**/*.nupkg
          nuGetFeedType: internal
          publishVstsFeed: $(publishVstsFeed)
          allowPackageConflicts: true
      - ${{ if and(eq(parameters.codesign, true), eq(parameters.publish_nuget, true)) }}:
        - output: nuget
          condition: succeeded()
          useDotNetTask: false
          packageParentPath: $(Pipeline.Workspace)
          packagesToPush: $(build.sourcesdirectory)/Artifacts/${{parameters.build_configuration}}/**/*.nupkg
          nuGetFeedType: external
          publishFeedCredentials: dotnet-orleans-nuget
          publishPackageMetadata: true
          allowPackageConflicts: true
  steps:
  # 分支分类适用于整个仓库；每条流水线仍保留自己的允许列表。
  - ${{ if ne(variables['System.TeamProject'], 'GitHub - PR Builds') }}:
    - task: PowerShell@2
      displayName: Validate pipeline branch
      inputs:
        pwsh: true
        targetType: inline
        script: |
          $allowedBranches = $env:ALLOWED_BRANCHES.Split(',')
          if ($env:BUILD_SOURCEBRANCH -cnotin $allowedBranches)
          {
            throw "Branch '$env:BUILD_SOURCEBRANCH' is not allowed for this pipeline. Allowed branches: $($allowedBranches -join ', ')."
          }
      env:
        ALLOWED_BRANCHES: ${{ iif(parameters.codesign, 'refs/heads/main,refs/heads/10.x', 'refs/heads/main,refs/heads/10.x,refs/heads/3.x') }}
  - ${{ if eq(variables.microbuild_signing, true) }}:
    - task: MicroBuildSigningPlugin@4
      displayName: Install MicroBuild plugin
      inputs:
        signType: real
        zipSources: false
        feedSource: https://dnceng.pkgs.visualstudio.com/_packaging/MicroBuildToolset/nuget/v3/index.json
        ConnectedServiceName: 'MicroBuild Signing Task (DevDiv)'
        ConnectedPMEServiceName: 248d384a-b39b-46e3-8ad5-c2c210d5e7ca
      env:
        TeamName: Orleans
        MicroBuildOutputFolderOverride: '$(Agent.TempDirectory)'
  - checkout: self
  - ${{ if and(eq(parameters.codesign, true), eq(parameters.publish_nuget, true)) }}:
    - task: NuGetToolInstaller@1
      displayName: Use NuGet 7.6 for API-key publishing
      inputs:
        versionSpec: '7.6.x'
  - task: UseNode@1
    displayName: 'Use Node.js'
    inputs:
      version: '24.x'
  - task: UseDotNet@2
    displayName: 'Use .NET Core sdk'
    inputs:
      useGlobalJson: true
  - ${{ if eq(variables.runCodeQL3000, 'true') }}:
    - task: CodeQL3000Init@0
      displayName: CodeQL Initialize
    # 仅当此任务实际执行 CodeQL3000 工作时，才为构建打标签。
    # 分析结果仍被视为最新时（例如两次运行仅相隔数天），这些任务不执行任何操作。
    - script: "echo ##vso[build.addbuildtag]CodeQL3000"
      displayName: 'Set CI CodeQL3000 tag'
      condition: ne(variables.CODEQL_DIST,'')
  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      command: build
      arguments: '$(build_flags) /bl:${{parameters.build_configuration}}-Build.binlog /p:Configuration=${{parameters.build_configuration}} $(solution)'
    env:
      VersionPrefix: ${{parameters.version_prefix}}
      ${{ if eq(parameters.include_suffix, true) }}:
        VersionSuffix: ${{parameters.version_suffix}}
      OfficialBuild: $(official_build)
  - ${{ if eq(variables.runCodeQL3000, 'true') }}:
    - task: CodeQL3000Finalize@0
      displayName: CodeQL Finalize
  - task: CmdLine@2
    displayName: Pack
    inputs:
      script: 'dotnet pack --no-build --no-restore $(build_flags) /bl:${{parameters.build_configuration}}-Pack.binlog /p:Configuration=${{parameters.build_configuration}} $(solution)'
    env:
      VersionPrefix: ${{parameters.version_prefix}}
      ${{ if eq(parameters.include_suffix, true) }}:
        VersionSuffix: ${{parameters.version_suffix}}
      OfficialBuild: $(official_build)
  # 签名
  - ${{ if eq(variables.microbuild_signing, true) }}:
    - task: NuGetCommand@2
      displayName: "Install packages for signing"
      inputs:
        command: 'custom'
        arguments: 'install sign/packages.config -ConfigFile sign/Nuget.Config'
    - task: MSBuild@1
      displayName: "Sign binaries and packages"
      inputs:
        solution: sign/sign.proj
        msbuildArguments: -t:sign -p:Configuration=${{parameters.build_configuration}}

# 测试
- ${{ if and(eq(parameters.skip_test, false), ne(variables.runCodeQL3000, 'true')) }}:
  - ${{ each suite in parameters.suites }}:
    - ${{ each framework in parameters.frameworks }}:
      - job: Test_${{suite}}_${{ replace(framework, '.', '_') }}
        displayName: ${{suite}} on ${{framework}}
        timeoutInMinutes: 120
        dependsOn: Build
        templateContext:
          outputs:
          - output: pipelineArtifact
            targetPath: '$(Build.ArtifactStagingDirectory)/test_outputs_${{suite}}_${{framework}}_$(Build.BuildId)'
            artifactName: 'test_outputs_${{suite}}_${{framework}}_$(System.JobAttempt)'
            condition: succeededOrFailed()
        variables:
          # 将 "net10.0" 转换为 "10.0.x"，供第二个 DotNetCoreCLI@2 使用。
          testFrameworkToInstall: ${{format('{0}.x', replace(upper(framework), 'NET', ''))}}
        steps:
        - checkout: self
        - task: UseNode@1
          displayName: 'Use Node.js'
          inputs:
            version: '24.x'
        - task: UseDotNet@2
          inputs:
            useGlobalJson: true
          displayName: 'Use .NET Core sdk'
        - task: DotNetCoreCLI@2
          displayName: Build
          inputs:
            command: build
            arguments: '$(build_flags) /bl:${{parameters.build_configuration}}-Build.binlog /p:Configuration=${{parameters.build_configuration}} $(solution)'
        - ${{ if eq(variables['System.TeamProject'], 'internal') }}:
          - task: AzureCLI@2
            displayName: Azure Login
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
              AZURE_CORE_USE_MSAL_HTTP_CACHE: "false"
            inputs:
              azureSubscription: 'dotnet-orleans-test'
              useGlobalConfig: true
              addSpnToEnvironment: true
              scriptType: pscore
              scriptLocation: inlineScript
              inlineScript: |
                # 从连接中提取 TenantId 和 ServicePrincipalId。
                Write-Host "##vso[task.setvariable variable=tenantId]$($env:tenantId)"
                Write-Host "##vso[task.setvariable variable=servicePrincipalId;issecret=true]$($env:servicePrincipalId)"
                # AzurePipelinesCredential 需要连接的 GUID，而非名称，因此在此获取它。
                Write-Host "##vso[task.setvariable variable=serviceConnectionId]$($env:SERVICE_CONNECTION_ID)"
                Get-ChildItem env:
        - task: UseDotNet@2
          # 测试所用框架可能与构建所用框架不同，因此需要此步骤。
          inputs:
            version: ${{variables.testFrameworkToInstall}}
          displayName: 'Install .NET Core sdk used in tests'
        - task: PowerShell@2
          displayName: Test
          env:
            ${{ if eq(variables['System.TeamProject'], 'internal') }}:
              AZURE_TENANT_ID: $(tenantId)
              AZURE_CLIENT_ID: $(servicePrincipalId)
              SERVICE_CONNECTION_ID: $(serviceConnectionId)
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          inputs:
            pwsh: true
            targetType: inline
            workingDirectory: '$(Build.SourcesDirectory)'
            script: |
              New-Item -ItemType Directory -Force -Path '$(Build.ArtifactStagingDirectory)/test_outputs_${{suite}}_${{framework}}_$(Build.BuildId)' | Out-Null

              $command = @(
                'dotnet'
                'test'
                '--solution'
                '$(solution)'
                '--no-build'
                '--report-trx'
                '--report-trx-filename'
                'testresults-${{framework}}-${{suite}}-{asm}_{tfm}_{arch}.trx'
                '--framework'
                '${{framework}}'
                '--configuration'
                '${{parameters.build_configuration}}'
                '--filter-query'
                '/[(Provider=None)&(Suite=${{suite}})]'
                '--minimum-expected-tests'
                '1'
                '--crashdump'
                '--crashdump-type'
                'Full'
                '--hangdump'
                '--hangdump-timeout'
                '10m'
                '--hangdump-type'
                'Full'
                '--max-parallel-test-modules'
                '1'
              )

              $executable = $command[0]
              $arguments = $command[1..($command.Count - 1)]
              & $executable @arguments
              exit $LASTEXITCODE
        - task: PublishTestResults@2
          displayName: Publishing test results
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: VSTest # Azure DevOps 使用此标识符表示 TRX 格式。
            testResultsFiles: '**/testresults-*.trx'
            mergeTestResults: true
            testRunTitle: ${{suite}} on ${{framework}}
        - task: CopyFiles@2
          displayName: 'Copy test logs'
          condition: succeededOrFailed()
          inputs:
            Contents: '**\*.log'
            TargetFolder: '$(Build.ArtifactStagingDirectory)/test_outputs_${{suite}}_${{framework}}_$(Build.BuildId)'
            OverWrite: true
        - task: CopyFiles@2
          displayName: 'Copy crash dumps'
          condition: succeededOrFailed()
          inputs:
            Contents: '**\*.dmp'
            TargetFolder: '$(Build.ArtifactStagingDirectory)/test_outputs_${{suite}}_${{framework}}_$(Build.BuildId)'
            OverWrite: true
